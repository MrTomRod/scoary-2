[project]
name = "scoary-2"
version = "0.0.16"
description = "Scoary2: Associate genes with traits!"
authors = [{ name = "MrTomRod", email = "roder.thomas@gmail.com" }]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENCE.md"]
requires-python = ">=3.14"
dependencies = [
    "numba>=0.62",  # first release supporting Python 3.14
    "pandas>=3,<4",
    "scipy>=1.16",
    "scikit-learn>=1.7",
    "fast-fisher>=0.0.5",
    "matplotlib>=3.10",
    "statsmodels>=0.14.5",
    "fire>=0.7",
    "mgwas-data-exploration-app>=0.1.1",
]

[project.scripts]
scoary2 = "scoary.scoary:main"
vcf2scoary = "scoary.vcf2scoary:main"

[project.urls]
Homepage = "https://github.com/MrTomRod/scoary-2"

[dependency-groups]
dev = [
    "pytest>=8",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "slow: end-to-end runs of the full pipeline (deselect with '-m \"not slow\"')",
]


[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scoary"
module-root = ""
